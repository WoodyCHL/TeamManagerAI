<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>title</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    background: #eef3f7;
    background-image:
      linear-gradient(rgba(14, 36, 56, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14, 36, 56, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    background-attachment: fixed;
    color: #0e2438;
    padding: 0 24px 40px;
  }

  /* top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 0 16px;
    position: relative;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .team-meta {
    font-size: 13px;
    color: #4a5f74;
    margin-top: 4px;
  }

  .menu-btn {
    background: #0e2438;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .menu-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: #eef3f7;
    margin: 2px 0;
    border-radius: 1px;
  }

  /* dropdown menu */
  .menu-dropdown {
    display: none;
    position: absolute;
    top: 60px;
    right: 0;
    background: #fff;
    border: 1px solid #d7e1e9;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(14, 36, 56, 0.14);
    min-width: 220px;
    overflow: hidden;
    z-index: 10;
  }

  .menu-dropdown.open {
    display: block;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid #eef3f7;
    background: #fff;
  }

  .menu-item:last-child {
    border-bottom: none;
  }

  .menu-item:hover {
    background: #f8fafb;
  }

  .menu-item.active {
    background: #fff6ee;
    color: #ff7a3d;
    font-weight: bold;
  }

  .menu-icon {
    font-size: 18px;
    width: 22px;
    text-align: center;
  }

  /* panels */
  .panel {
    background: #fff;
    border: 1px solid #d7e1e9;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(14, 36, 56, 0.06);
    display: none;
  }

  .panel.active {
    display: block;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7f92;
    margin: 0;
  }

  .btn {
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    padding: 7px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .btn-primary {
    background: #ff7a3d;
    color: #fff;
  }

  .btn-secondary {
    background: #eef3f7;
    color: #0e2438;
    border: 1px solid #d7e1e9;
  }

  .btn-danger {
    background: #fff0ef;
    color: #c23b3b;
    border: 1px solid #f3c6c2;
    font-size: 11px;
    padding: 4px 8px;
  }

  /* roster */
  .member-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eef3f7;
    font-size: 14px;
    gap: 8px;
  }

  .member-row:last-child {
    border-bottom: none;
  }

  .member-name {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .member-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .admin-badge {
    font-size: 11px;
    background: #ff7a3d;
    color: #fff;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .role-badge {
    font-size: 11px;
    background: #2fd6c4;
    color: #0e2438;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .role-select, .status-select {
    font-family: Arial, sans-serif;
    font-size: 12px;
    padding: 4px 6px;
    border: 1px solid #d7e1e9;
    border-radius: 6px;
    background: #fff;
  }

  /* tasks */
  .task-card {
    border: 1px solid #eef3f7;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .task-card:last-child {
    margin-bottom: 0;
  }

  .task-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .task-admin-controls {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .task-admin-controls .btn {
    font-size: 11px;
    padding: 4px 8px;
  }

  .task-title {
    font-weight: bold;
    font-size: 14px;
  }

  .task-desc {
    font-size: 13px;
    color: #4a5f74;
    margin-top: 4px;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .subsystem-badge {
    font-size: 11px;
    background: #eef3f7;
    color: #4a5f74;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: capitalize;
  }

  .assignee-tag {
    font-size: 12px;
    color: #4a5f74;
  }

  .empty-state {
    font-size: 13px;
    color: #8a99a8;
    font-style: italic;
    padding: 8px 0;
  }

  /* AI task creation panel */
  .ai-form {
    display: none;
    background: #f8fafb;
    border: 1px solid #d7e1e9;
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .ai-form.open {
    display: block;
  }

  .ai-placeholder-note {
    background: #fff6ee;
    border: 1px solid #ffd9bd;
    border-left: 4px solid #ff7a3d;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    color: #8a4318;
    margin-bottom: 12px;
  }

  .assignee-slot-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
  }

  .assignee-slot-row:first-child {
    margin-top: 4px;
  }

  .assignee-slot-row select {
    margin-top: 0;
    flex: 1;
  }

  .assignee-slot-remove {
    background: none;
    border: none;
    color: #8a99a8;
    font-size: 16px;
    cursor: pointer;
    padding: 0 6px;
    flex-shrink: 0;
  }

  .assignee-slot-remove:hover {
    color: #c23b3b;
  }

  .refine-box {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed #d7e1e9;
  }

  .refine-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .refine-row input {
    margin-top: 0;
    flex: 1;
  }

  .refine-row .btn {
    flex-shrink: 0;
  }

  label {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #6b7f92;
  }

  label:first-of-type {
    margin-top: 0;
  }

  input, textarea, select {
    width: 100%;
    padding: 8px 10px;
    margin-top: 4px;
    border: 1px solid #d7e1e9;
    border-radius: 6px;
    background: #fff;
    font-size: 13px;
    font-family: Arial, sans-serif;
    color: #0e2438;
  }

  textarea {
    resize: vertical;
    min-height: 50px;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #ff7a3d;
  }

  /* meeting notes — page list */
  .note-page-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px;
    border-bottom: 1px solid #eef3f7;
    cursor: pointer;
    border-radius: 6px;
  }

  .note-page-row:hover {
    background: #f8fafb;
  }

  .note-page-row:last-child {
    border-bottom: none;
  }

  .note-page-title {
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .note-page-meta {
    font-size: 11px;
    color: #8a99a8;
  }

  .note-page-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .pin-toggle-btn {
    background: none;
    border: none;
    font-size: 16px;
    color: #d7e1e9;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }

  .pin-toggle-btn:hover {
    color: #ffb08a;
  }

  .pin-toggle-btn.pinned {
    color: #ff7a3d;
  }

  /* meeting notes — editor */
  .note-title-input {
    font-size: 20px;
    font-weight: bold;
    border: none;
    padding: 8px 0;
    margin-top: 8px;
    background: transparent;
  }

  .note-title-input:focus {
    border: none;
    outline: none;
  }

  .note-subsystem-select {
    width: auto;
    font-size: 12px;
    padding: 5px 8px;
    margin-top: 0;
    margin-bottom: 8px;
    color: #4a5f74;
  }

  .editor-toolbar {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eef3f7;
    margin-bottom: 12px;
  }

  .tb-btn {
    font-family: Arial, sans-serif;
    font-size: 13px;
    background: #f8fafb;
    border: 1px solid #d7e1e9;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    color: #0e2438;
  }

  .tb-btn:hover {
    background: #eef3f7;
  }

  .note-body-editor {
    min-height: 220px;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }

  .note-body-editor h3 {
    font-size: 16px;
    margin: 14px 0 6px;
  }

  .note-body-editor ul {
    padding-left: 22px;
  }

  .note-body-editor .checklist-item {
    list-style: none;
    margin-left: -22px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }

  .note-body-editor .checklist-item input {
    width: auto;
    margin-top: 3px;
  }

  .note-save-status {
    font-size: 11px;
    color: #8a99a8;
    margin-top: 12px;
    text-align: right;
  }

  .note-ai-tasks-box {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #eef3f7;
  }

  .extracted-task-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    border: 1px solid #eef3f7;
    border-radius: 6px;
    margin-top: 8px;
  }

  .extracted-task-row input[type="checkbox"] {
    width: auto;
    margin-top: 3px;
    accent-color: #ff7a3d;
  }

  .extracted-task-info {
    flex: 1;
  }

  .extracted-task-title {
    font-weight: bold;
    font-size: 13px;
  }

  .extracted-task-desc {
    font-size: 12px;
    color: #4a5f74;
    margin-top: 2px;
  }

  .extracted-task-meta {
    margin-top: 4px;
  }

  .add-extracted-btn {
    margin-top: 12px;
  }

  .event-form {
    display: none;
    background: #f8fafb;
    border: 1px solid #d7e1e9;
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .event-form.open {
    display: block;
  }

  .countdown-card {
    background: #0e2438;
    color: #eef3f7;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
    text-align: center;
  }

  .countdown-label {
    font-size: 13px;
    color: #9fb4c7;
    margin-bottom: 10px;
  }

  .countdown-event-name {
    font-size: 18px;
    font-weight: bold;
  }

  .countdown-timer {
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .countdown-timer span {
    font-size: 28px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    color: #ff7a3d;
  }

  .countdown-timer span small {
    font-size: 12px;
    color: #9fb4c7;
    font-weight: normal;
    margin-left: 2px;
  }

  .ftc-event-card {
    border: 1px solid #eef3f7;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .ftc-event-card:hover {
    border-color: #ff7a3d;
    background: #fff6ee;
  }

  .ftc-event-card.event-past {
    opacity: 0.55;
  }

  .ftc-event-name {
    font-weight: bold;
    font-size: 13px;
  }

  .ftc-event-meta {
    font-size: 12px;
    color: #4a5f74;
    margin-top: 4px;
  }

  .event-detail-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(14, 36, 56, 0.5);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .event-detail-overlay.open {
    display: flex;
  }

  .event-detail-card {
    background: #fff;
    border-radius: 10px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 12px 32px rgba(14, 36, 56, 0.25);
  }

  .match-card {
    border: 1px solid #eef3f7;
    border-radius: 6px;
    padding: 10px;
    margin-top: 8px;
  }

  .match-header {
    font-size: 11px;
    font-weight: bold;
    color: #6b7f92;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .match-alliance {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 13px;
    border-radius: 4px;
  }

  .match-alliance.match-winner {
    background: #fff6ee;
  }

  .match-alliance-label {
    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }

  .alliance-red {
    background: #c23b3b;
  }

  .alliance-blue {
    background: #2f6fd6;
  }

  .match-teams {
    flex: 1;
  }

  .match-score {
    font-weight: bold;
    font-family: 'Courier New', monospace;
  }

  .match-not-played {
    font-size: 11px;
    color: #8a99a8;
    font-style: italic;
    margin-top: 4px;
  }

  .event-detail-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    font-size: 22px;
    color: #8a99a8;
    cursor: pointer;
    line-height: 1;
  }

  .event-detail-close:hover {
    color: #0e2438;
  }

  .event-detail-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 16px;
    padding-right: 24px;
  }

  .event-detail-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #eef3f7;
    font-size: 13px;
  }

  .event-detail-row:last-of-type {
    border-bottom: none;
  }

  .event-detail-label {
    color: #6b7f92;
    font-weight: bold;
    flex-shrink: 0;
  }

  .event-detail-value {
    text-align: right;
    color: #0e2438;
  }

  .event-detail-livestream {
    display: block;
    text-align: center;
    margin-top: 16px;
    text-decoration: none;
  }

  #error {
    color: #c23b3b;
    margin-top: 16px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1 id="teamNameLabel">Loading…</h1>
    <div class="team-meta" id="teamNumberLabel"></div>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-dropdown" id="menuDropdown">
    <div class="menu-item" data-view="roster" onclick="switchView('roster')">
      <span class="menu-icon">👥</span> Team roster
    </div>
    <div class="menu-item" data-view="tasks" onclick="switchView('tasks')">
      <span class="menu-icon">✅</span> Tasks
    </div>
    <div class="menu-item" data-view="notes" onclick="switchView('notes')">
      <span class="menu-icon">📝</span> Meeting notes
    </div>
    <div class="menu-item" data-view="events" onclick="switchView('events')">
      <span class="menu-icon">🏆</span> Events
    </div>
  </div>
</div>

<!-- ROSTER -->
<div class="panel" id="panel-roster">
  <div class="panel-head">
    <h2>Team roster</h2>
  </div>
  <div id="rosterList">Loading members…</div>
</div>

<!-- TASKS -->
<div class="panel" id="panel-tasks">
  <div class="panel-head">
    <h2>Tasks</h2>
    <button class="btn btn-primary" id="createTaskBtn" style="display:none;" onclick="toggleAiForm()">+ Create task with AI</button>
  </div>

  <div class="ai-form" id="aiForm">
    <div class="ai-placeholder-note">
      Powered by AI (via OpenRouter). Describe the task roughly — it'll write a clear title, description, and suggest a suitable team member based on their role.
    </div>

    <label for="aiSubsystem">Subsystem</label>
    <select id="aiSubsystem">
      <option value="drivetrain">Drivetrain</option>
      <option value="arm">Arm</option>
      <option value="sensors">Sensors</option>
      <option value="programming">Programming</option>
      <option value="testing">Testing</option>
    </select>

    <label for="aiDescription">Rough description</label>
    <textarea id="aiDescription" placeholder="e.g. wire up the drivetrain motors and test forward/reverse"></textarea>

    <button class="btn btn-secondary" id="generateBtn" style="margin-top:12px;" onclick="generateTaskWithAI()">Generate</button>

    <div id="aiResult" style="display:none; margin-top: 14px; border-top: 1px solid #d7e1e9; padding-top: 14px;">
      <label for="taskTitle">Task title</label>
      <input id="taskTitle">

      <label for="taskDesc">Description</label>
      <textarea id="taskDesc"></textarea>

      <label>Assign to</label>
      <div id="assigneeSlots"></div>

      <div class="refine-box">
        <label for="refineFeedback">Not quite right? Tell it what to fix</label>
        <div class="refine-row">
          <input id="refineFeedback" placeholder="e.g. use goBILDA motors instead of NEO">
          <button type="button" class="btn btn-secondary" id="refineBtn" onclick="regenerateWithFeedback()">Refine</button>
        </div>
      </div>

      <button class="btn btn-primary" id="saveTaskBtn" style="margin-top:12px;" onclick="saveTask()">Save task</button>
      <button class="btn btn-secondary" style="margin-top:12px;" onclick="toggleAiForm()">Cancel</button>
    </div>
  </div>

  <div id="taskList"></div>
</div>

<!-- MEETING NOTES -->
<div class="panel" id="panel-notes">

  <!-- LIST VIEW -->
  <div id="notesListView">
    <div class="panel-head">
      <h2>Meeting notes</h2>
      <button class="btn btn-primary" onclick="createNotePage()">+ New note</button>
    </div>
    <div id="notesPageList"></div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="notesEditorView" style="display:none;">
    <div class="panel-head">
      <button class="btn btn-secondary" onclick="closeNoteEditor()">&larr; Back</button>
      <span>
        <button class="pin-toggle-btn" id="editorPinBtn" onclick="toggleCurrentNotePin()" title="Pin to top">★</button>
        <button class="btn btn-danger" id="deleteNoteBtn" onclick="deleteCurrentNote()">Delete</button>
      </span>
    </div>

    <input id="noteTitleInput" class="note-title-input" placeholder="Untitled note" oninput="scheduleNoteSave()">

    <select id="noteSubsystemSelect" class="note-subsystem-select" onchange="scheduleNoteSave()">
      <option value="">No subsystem tag</option>
      <option value="drivetrain">Drivetrain</option>
      <option value="arm">Arm</option>
      <option value="sensors">Sensors</option>
      <option value="programming">Programming</option>
      <option value="testing">Testing</option>
    </select>

    <div class="editor-toolbar">
      <button type="button" class="tb-btn" onclick="formatDoc('bold')"><b>B</b></button>
      <button type="button" class="tb-btn" onclick="formatDoc('italic')"><i>I</i></button>
      <button type="button" class="tb-btn" onclick="formatDoc('formatBlock', 'H3')">H</button>
      <button type="button" class="tb-btn" onclick="formatDoc('insertUnorderedList')">&bull; List</button>
      <button type="button" class="tb-btn" onclick="insertChecklistItem()">&#9744; Check</button>
    </div>

    <div id="noteBodyEditor" class="note-body-editor" contenteditable="true" oninput="scheduleNoteSave()"></div>

    <div class="note-save-status" id="noteSaveStatus"></div>

    <div class="note-ai-tasks-box" id="noteAiTasksBox" style="display:none;">
      <button class="btn btn-secondary" id="extractTasksBtn" onclick="extractTasksFromNote()">✨ Generate tasks from this note</button>
      <div id="extractedTasksList"></div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBeEGjkfjNGK0ftzvxLhqc4oZ3ZT35_5vc",
    authDomain: "yr10digital.firebaseapp.com",
    projectId: "yr10digital",
    storageBucket: "yr10digital.firebasestorage.app",
    messagingSenderId: "485437103519",
    appId: "1:485437103519:web:f1174f549f5a2f811df1aa"
  };

  // ---------------------------------------------------------
  // Placeholder for your OpenRouter API key.
  // Get one free at openrouter.ai -> Settings -> Keys (no age
  // restriction, unlike Google AI Studio).
  // NOTE: since this is a static site, this key is visible to
  // anyone who views the page source. Fine for a free-tier
  // school project key, but worth knowing.
  // ---------------------------------------------------------
  const OPENROUTER_API_KEY = "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";

  // Cloudflare Worker that proxies FTC Events API calls (avoids CORS
  // and keeps the FTC token server-side, not in this public repo)
  const FTC_PROXY_URL = "https://restless-mouse-a2ff.s12471.workers.dev";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const teamId = localStorage.getItem('teamId');
  const myName = localStorage.getItem('memberName');

  let currentMembers = [];
  let currentTasks = [];
  let currentNotes = [];
  let currentEvents = [];
  let teamRef = null;
  let isCurrentUserLead = false;

  const ROLES = ['Coder', 'Builder'];

  if (!teamId) {
    document.getElementById('error').textContent = 'No team found — go back and create or join a team first.';
  } else {
    loadTeam();
  }

  // ---------------- NAVIGATION ----------------

  window.toggleMenu = function() {
    document.getElementById('menuDropdown').classList.toggle('open');
  };

  window.switchView = function(view) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${view}`).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.querySelector(`.menu-item[data-view="${view}"]`).classList.add('active');

    document.getElementById('menuDropdown').classList.remove('open');
  };

  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('menuDropdown');
    const menuBtn = document.querySelector('.menu-btn');
    if (!dropdown.contains(e.target) && !menuBtn.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });

  // ---------------- LOAD ----------------

  async function loadTeam() {
    try {
      teamRef = doc(db, "teams", teamId);
      const snap = await getDoc(teamRef);

      if (!snap.exists()) {
        document.getElementById('error').textContent = 'Team not found in database.';
        return;
      }

      const team = snap.data();
      currentMembers = team.members || [];
      currentTasks = team.tasks || [];
      currentNotes = team.notes || [];
      currentEvents = team.events || [];

      const me = currentMembers.find(
        m => m.name.trim().toLowerCase() === (myName || '').trim().toLowerCase()
      );
      isCurrentUserLead = !!(me && me.isAdmin);

      document.getElementById('teamNameLabel').textContent = team.name;
      document.getElementById('teamNumberLabel').textContent = '';

      if (isCurrentUserLead) {
        document.getElementById('createTaskBtn').style.display = 'inline-block';
        document.getElementById('addEventBtn').style.display = 'inline-block';
        document.getElementById('syncFtcBtn').style.display = 'inline-block';
      }

      if (team.ftcTeamNumber) document.getElementById('ftcTeamNumber').value = team.ftcTeamNumber;
      if (team.ftcSeason) document.getElementById('ftcSeason').value = team.ftcSeason;

      renderRoster();
      renderTasks();
      renderNotes();
      renderEvents();

      switchView('roster');

    } catch (err) {
      console.error(err);
      document.getElementById('error').textContent = 'Error loading team: ' + err.message;
    }
  }

  async function saveTeamField(fields) {
    try {
      await updateDoc(teamRef, fields);
    } catch (err) {
      console.error(err);
      document.getElementById('error').textContent = 'Could not save: ' + err.message;
    }
  }

  // ---------------- ROSTER ----------------

  function renderRoster() {
    const list = document.getElementById('rosterList');

    if (currentMembers.length === 0) {
      list.innerHTML = '<div class="empty-state">No members yet.</div>';
      return;
    }

    list.innerHTML = currentMembers.map((m, i) => `
      <div class="member-row">
        <span class="member-name">
          ${escapeHtml(m.name)}
          ${m.isAdmin ? '<span class="admin-badge">TEAM LEAD</span>' : ''}
        </span>
        <span class="member-controls">
          ${roleControlHtml(m, i)}
          ${kickButtonHtml(m, i)}
        </span>
      </div>
    `).join('');

    if (isCurrentUserLead) {
      currentMembers.forEach((m, i) => {
        const select = document.getElementById(`roleSelect-${i}`);
        if (select) select.addEventListener('change', () => setRole(i, select.value));

        const kickBtn = document.getElementById(`kickBtn-${i}`);
        if (kickBtn) kickBtn.addEventListener('click', () => kickMember(i));
      });
    }
  }

  function roleControlHtml(m, i) {
    if (isCurrentUserLead) {
      const options = ['<option value="">No role</option>']
        .concat(ROLES.map(r => `<option value="${r}" ${m.role === r ? 'selected' : ''}>${r}</option>`))
        .join('');
      return `<select class="role-select" id="roleSelect-${i}">${options}</select>`;
    }
    return m.role ? `<span class="role-badge">${escapeHtml(m.role)}</span>` : '';
  }

  function kickButtonHtml(m, i) {
    if (isCurrentUserLead && !m.isAdmin) {
      return `<button class="btn btn-danger" id="kickBtn-${i}">Remove</button>`;
    }
    return '';
  }

  async function setRole(index, newRole) {
    currentMembers[index] = { ...currentMembers[index], role: newRole || null };
    await saveTeamField({ members: currentMembers });
  }

  async function kickMember(index) {
    const member = currentMembers[index];
    if (!confirm(`Remove ${member.name} from the team? This can't be undone.`)) return;

    currentMembers = currentMembers.filter((_, i) => i !== index);
    await saveTeamField({ members: currentMembers });
    renderRoster();
  }

  // ---------------- TASKS ----------------

  function renderTasks() {
    const list = document.getElementById('taskList');

    if (currentTasks.length === 0) {
      list.innerHTML = '<div class="empty-state">No tasks yet.</div>';
      return;
    }

    list.innerHTML = currentTasks.map((t, i) => {
      const assignees = getTaskAssignees(t);
      const assigneeText = assignees.length > 0 ? '→ ' + assignees.map(escapeHtml).join(', ') : 'Unassigned';

      return `
      <div class="task-card">
        <div class="task-top">
          <div>
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-desc">${escapeHtml(t.description || '')}</div>
          </div>
          ${isCurrentUserLead ? `
            <span class="task-admin-controls">
              <button class="btn btn-secondary" id="editBtn-${i}">Edit</button>
              <button class="btn btn-danger" id="deleteBtn-${i}">Delete</button>
            </span>
          ` : ''}
        </div>
        <div class="task-meta">
          <span class="subsystem-badge">${escapeHtml(t.subsystem || 'general')}</span>
          <span class="assignee-tag">${assigneeText}</span>
          <select class="status-select" id="statusSelect-${i}">
            <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>To do</option>
            <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In progress</option>
            <option value="done" ${t.status === 'done' ? 'selected' : ''}>Done</option>
          </select>
        </div>
      </div>
    `;
    }).join('');

    currentTasks.forEach((t, i) => {
      const select = document.getElementById(`statusSelect-${i}`);
      if (select) select.addEventListener('change', () => setTaskStatus(i, select.value));

      const editBtn = document.getElementById(`editBtn-${i}`);
      if (editBtn) editBtn.addEventListener('click', () => editTask(i));

      const deleteBtn = document.getElementById(`deleteBtn-${i}`);
      if (deleteBtn) deleteBtn.addEventListener('click', () => deleteTask(i));
    });
  }

  // supports both the old single "assignedName" field (legacy tasks)
  // and the new "assignedNames" array, so nothing already saved breaks
  function getTaskAssignees(t) {
    if (Array.isArray(t.assignedNames)) return t.assignedNames;
    if (t.assignedName) return [t.assignedName];
    return [];
  }

  async function setTaskStatus(index, newStatus) {
    currentTasks[index] = { ...currentTasks[index], status: newStatus };
    await saveTeamField({ tasks: currentTasks });
  }

  async function deleteTask(index) {
    const task = currentTasks[index];
    if (!confirm(`Delete task "${task.title}"? This can't be undone.`)) return;

    currentTasks = currentTasks.filter((_, i) => i !== index);
    await saveTeamField({ tasks: currentTasks });
    renderTasks();
  }

  let editingTaskIndex = null;

  // ---------------- ASSIGNEE SLOTS ----------------

  // maps each subsystem to the role best suited for it, so the
  // assignee dropdown can recommend the right person automatically
  function getRecommendedRole(subsystem) {
    const map = {
      drivetrain: 'Builder',
      arm: 'Builder',
      sensors: 'Builder',
      programming: 'Coder',
      testing: null // could go either way, no strong recommendation
    };
    return map[subsystem] || null;
  }

  function memberOptionsHtml(selectedName) {
    const subsystem = document.getElementById('aiSubsystem').value;
    const recommendedRole = getRecommendedRole(subsystem);

    // recommended-role members float to the top of the list
    const sortedMembers = [...currentMembers].sort((a, b) => {
      const aMatch = recommendedRole && a.role === recommendedRole ? 0 : 1;
      const bMatch = recommendedRole && b.role === recommendedRole ? 0 : 1;
      return aMatch - bMatch;
    });

    const options = ['<option value="">— select member —</option>']
      .concat(sortedMembers.map(m => {
        const isRecommended = recommendedRole && m.role === recommendedRole;
        const label = `${isRecommended ? '★ ' : ''}${m.name}${m.role ? ' (' + m.role + ')' : ''}${isRecommended ? ' — recommended' : ''}`;
        return `<option value="${escapeHtml(m.name)}" ${m.name === selectedName ? 'selected' : ''}>${escapeHtml(label)}</option>`;
      }));
    return options.join('');
  }

  function renderAssigneeSlots(selectedNames) {
    const container = document.getElementById('assigneeSlots');
    const names = selectedNames.length > 0 ? selectedNames : [''];

    container.innerHTML = names.map((name, i) => `
      <div class="assignee-slot-row">
        <select class="assignee-slot-select" data-slot="${i}">${memberOptionsHtml(name)}</select>
        ${names.length > 1 ? `<button type="button" class="assignee-slot-remove" data-remove="${i}">&times;</button>` : ''}
      </div>
    `).join('');

    container.querySelectorAll('.assignee-slot-select').forEach(sel => {
      sel.addEventListener('change', onAssigneeSlotChange);
    });

    container.querySelectorAll('.assignee-slot-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.remove, 10);
        const current = getAssigneeSlotValues();
        current.splice(idx, 1);
        renderAssigneeSlots(current);
      });
    });
  }

  function onAssigneeSlotChange() {
    const values = getAssigneeSlotValues();
    const lastValue = values[values.length - 1];

    // if the last slot just got filled in, add a fresh empty slot after it
    if (lastValue && lastValue !== '') {
      renderAssigneeSlots([...values, '']);
    }
  }

  function getAssigneeSlotValues() {
    return Array.from(document.querySelectorAll('.assignee-slot-select')).map(s => s.value);
  }

  // re-rank the recommendation whenever the subsystem changes,
  // without losing whatever's already been picked
  document.getElementById('aiSubsystem').addEventListener('change', () => {
    const current = getAssigneeSlotValues();
    if (current.length > 0) renderAssigneeSlots(current);
  });

  function editTask(index) {
    editingTaskIndex = index;
    const t = currentTasks[index];

    document.getElementById('aiForm').classList.add('open');
    document.getElementById('aiSubsystem').value = t.subsystem || 'drivetrain';
    document.getElementById('aiDescription').value = '';

    document.getElementById('taskTitle').value = t.title || '';
    document.getElementById('taskDesc').value = t.description || '';

    renderAssigneeSlots(getTaskAssignees(t));

    document.getElementById('aiResult').style.display = 'block';
    document.getElementById('panel-tasks').scrollIntoView({ behavior: 'smooth' });
  }

  window.toggleAiForm = function() {
    editingTaskIndex = null;
    document.getElementById('aiForm').classList.toggle('open');
    document.getElementById('aiResult').style.display = 'none';
  };

  // Builds a tightly-scoped prompt so Gemini stays grounded in
  // real robotics competition practice instead of generic advice.
  // Shared hardware constraints so both the initial generation and any
  // refinement stay locked to FTC-legal parts, not FRC/VEX equivalents.
  const FTC_HARDWARE_RULES = `This team competes in FIRST Tech Challenge (FTC) specifically — not FRC, not VEX. Stay strictly within FTC-legal hardware:
- Motors: 12V DC motors only, e.g. goBILDA 5203 series, REV Robotics HD Hex motors, Tetrix motors. NEVER mention NEO motors, SPARK MAX, or any FRC-style brushless motor/controller — these are FRC hardware and are not FTC-legal.
- Control system: REV Control Hub and optional REV Expansion Hub only. NEVER mention roboRIO, CAN bus, Talon, Victor, or Falcon — these are FRC-only.
- Actuators: standard or continuous-rotation hobby servos (goBILDA/REV/Tetrix branded or generic).
- Sensors: REV color/distance sensors, motor-integrated encoders, odometry pods ("dead wheels") for position tracking, REV IMU.
- Mecanum drives: the four wheels mount in the same orientation as a normal drivetrain (not rotated 90° from each other) — it's the rollers on each wheel's surface that sit at 45°, giving the strafing motion.
If you are not confident a specific part is FTC-legal, describe it generically (e.g. "the drive motors") rather than naming a part that might be wrong.`;

  function buildRoboticsPrompt(subsystem, roughDescription) {
    const memberList = currentMembers
      .map(m => `- ${m.name}${m.role ? ` (role: ${m.role})` : ' (no role assigned)'}`)
      .join('\n');

    return `You are helping a student FTC (FIRST Tech Challenge) robotics team turn a rough idea into a clear, actionable build task.

${FTC_HARDWARE_RULES}

Team roster:
${memberList || '- (no members yet)'}

Subsystem this task belongs to: ${subsystem}
Rough description from the team lead: "${roughDescription}"

Write a single build task for this subsystem. Use accurate, concrete robotics engineering language appropriate for a student team — real terms (e.g. "gear ratio," "encoder ticks," "PID tuning," "chassis alignment") where relevant, not vague generalities. Keep it scoped to something completable in one work session (1-3 hours), not an entire subsystem.

Respond with ONLY valid JSON, no markdown fences, no extra text, in exactly this shape:
{"title": "short task title, under 8 words", "description": "2-3 sentences, specific and actionable", "suggestedAssignee": "name of the best-suited member from the roster above, or empty string if none fit"}`;
  }

  function buildRefinementPrompt(subsystem, previousTitle, previousDescription, feedback) {
    const memberList = currentMembers
      .map(m => `- ${m.name}${m.role ? ` (role: ${m.role})` : ' (no role assigned)'}`)
      .join('\n');

    return `You previously drafted this FTC robotics build task for the "${subsystem}" subsystem:

Title: "${previousTitle}"
Description: "${previousDescription}"

${FTC_HARDWARE_RULES}

Team roster:
${memberList || '- (no members yet)'}

The team lead wants this revised with the following feedback: "${feedback}"

Rewrite the task, applying that feedback while keeping it scoped to one work session (1-3 hours).

Respond with ONLY valid JSON, no markdown fences, no extra text, in exactly this shape:
{"title": "short task title, under 8 words", "description": "2-3 sentences, specific and actionable", "suggestedAssignee": "name of the best-suited member from the roster above, or empty string if none fit"}`;
  }

  function buildTaskExtractionPrompt(noteTitle, noteText) {
    const memberList = currentMembers
      .map(m => `- ${m.name}${m.role ? ` (role: ${m.role})` : ' (no role assigned)'}`)
      .join('\n');

    return `Here are meeting notes from an FTC (FIRST Tech Challenge) robotics team, titled "${noteTitle || 'Untitled'}":

"""
${noteText}
"""

${FTC_HARDWARE_RULES}

Team roster:
${memberList || '- (no members yet)'}

Read through these notes and pull out concrete, actionable build tasks that were discussed or implied — things someone could actually go do, not vague topics. Ignore small talk, scheduling chat, or anything that isn't an actual build/programming/testing action. If there are no real actionable tasks in these notes, return an empty array.

For each task, classify it into exactly one of these subsystems: drivetrain, arm, sensors, programming, testing.

Respond with ONLY valid JSON, no markdown fences, no extra text — a JSON array in exactly this shape:
[{"title": "short task title, under 8 words", "description": "1-2 sentences, specific and actionable", "subsystem": "one of: drivetrain, arm, sensors, programming, testing", "suggestedAssignee": "name of the best-suited member from the roster above, or empty string if none fit"}]`;
  }

  // Free models on OpenRouter get renamed/deprecated fairly often.
  // Try several known candidates in order and use whichever responds.
  // If ALL of these ever fail, check openrouter.ai/models, filter by
  // "Free", and swap in whatever's currently listed.
  const CANDIDATE_MODELS = [
    "openai/gpt-oss-20b:free",
    "deepseek/deepseek-chat-v3.1:free",
    "meta-llama/llama-3.3-70b-instruct:free",
    "meta-llama/llama-3.1-8b-instruct:free",
    "google/gemma-2-9b-it:free",
    "qwen/qwen-2.5-72b-instruct:free",
    "mistralai/mistral-7b-instruct:free",
    "microsoft/phi-3-mini-128k-instruct:free"
  ];

  // Shared caller used by both first-generation and refinement —
  // tries each candidate model in turn and returns the parsed JSON.
  async function callAIForTask(promptText) {
    let res = null;
    let lastError = null;

    for (const model of CANDIDATE_MODELS) {
      res = await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model,
            temperature: 0.3,
            messages: [{ role: "user", content: promptText }]
          })
        }
      );

      if (res.ok) break;
      lastError = await res.text();
      res = null;
    }

    if (!res) {
      throw new Error(`All AI models unavailable. Last error: ${lastError}`);
    }

    const data = await res.json();
    const rawText = data.choices?.[0]?.message?.content;
    if (!rawText) throw new Error('No response from AI.');

    const cleaned = rawText.replace(/```json|```/g, '').trim();
    return JSON.parse(cleaned);
  }

  window.generateTaskWithAI = async function() {
    const subsystem = document.getElementById('aiSubsystem').value;
    const description = document.getElementById('aiDescription').value.trim();

    if (!description) {
      document.getElementById('error').textContent = 'Describe the task before generating.';
      return;
    }

    const genBtn = document.getElementById('generateBtn');
    if (genBtn) { genBtn.disabled = true; genBtn.textContent = 'Generating…'; }
    document.getElementById('error').textContent = '';

    try {
      const parsed = await callAIForTask(buildRoboticsPrompt(subsystem, description));

      document.getElementById('taskTitle').value = parsed.title || `${subsystem} task`;
      document.getElementById('taskDesc').value = parsed.description || description;

      const suggested = parsed.suggestedAssignee || '';
      const validSuggestion = currentMembers.some(m => m.name === suggested) ? suggested : '';
      renderAssigneeSlots(validSuggestion ? [validSuggestion] : ['']);

      document.getElementById('aiResult').style.display = 'block';

    } catch (err) {
      console.error(err);
      document.getElementById('error').textContent = 'AI generation failed: ' + err.message + ' — check your OpenRouter API key is set correctly.';
      // fall back to a manual placeholder so the form is still usable
      document.getElementById('taskTitle').value = `${subsystem} task`;
      document.getElementById('taskDesc').value = description;
      renderAssigneeSlots(['']);
      document.getElementById('aiResult').style.display = 'block';
    } finally {
      if (genBtn) { genBtn.disabled = false; genBtn.textContent = 'Generate'; }
    }
  };

  window.regenerateWithFeedback = async function() {
    const feedback = document.getElementById('refineFeedback').value.trim();
    if (!feedback) {
      document.getElementById('error').textContent = 'Type what you\'d like changed before refining.';
      return;
    }

    const subsystem = document.getElementById('aiSubsystem').value;
    const previousTitle = document.getElementById('taskTitle').value.trim();
    const previousDescription = document.getElementById('taskDesc').value.trim();

    const refineBtn = document.getElementById('refineBtn');
    refineBtn.disabled = true;
    refineBtn.textContent = 'Refining…';
    document.getElementById('error').textContent = '';

    try {
      const parsed = await callAIForTask(
        buildRefinementPrompt(subsystem, previousTitle, previousDescription, feedback)
      );

      document.getElementById('taskTitle').value = parsed.title || previousTitle;
      document.getElementById('taskDesc').value = parsed.description || previousDescription;

      const suggested = parsed.suggestedAssignee || '';
      const validSuggestion = currentMembers.some(m => m.name === suggested) ? suggested : '';
      if (validSuggestion) renderAssigneeSlots([validSuggestion]);

      document.getElementById('refineFeedback').value = '';

    } catch (err) {
      console.error(err);
      document.getElementById('error').textContent = 'Refinement failed: ' + err.message;
    } finally {
      refineBtn.disabled = false;
      refineBtn.textContent = 'Refine';
    }
  };

  window.saveTask = async function() {
    const title = document.getElementById('taskTitle').value.trim();
    const description = document.getElementById('taskDesc').value.trim();
    const subsystem = document.getElementById('aiSubsystem').value;

    const assignedNames = [...new Set(getAssigneeSlotValues().filter(v => v !== ''))];

    if (!title) {
      document.getElementById('error').textContent = 'Task needs a title.';
      return;
    }

    const saveBtn = document.getElementById('saveTaskBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
      if (editingTaskIndex !== null) {
        const { assignedName, ...rest } = currentTasks[editingTaskIndex];
        currentTasks[editingTaskIndex] = {
          ...rest,
          title,
          description,
          subsystem,
          assignedNames
        };
      } else {
        const newTask = {
          id: Date.now().toString(),
          title,
          description,
          subsystem,
          assignedNames,
          status: 'todo'
        };
        currentTasks = [...currentTasks, newTask];
      }

      await saveTeamField({ tasks: currentTasks });
      renderTasks();

      editingTaskIndex = null;
      document.getElementById('aiForm').classList.remove('open');
      document.getElementById('aiDescription').value = '';
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save task';
    }
  };

  // ---------------- MEETING NOTES (page-based) ----------------

  let currentNoteId = null;
  let noteSaveTimer = null;

  function renderNotes() {
    const list = document.getElementById('notesPageList');

    if (currentNotes.length === 0) {
      list.innerHTML = '<div class="empty-state">No notes yet. Create your first one.</div>';
      return;
    }

    const sorted = [...currentNotes].sort((a, b) => {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return b.updatedAt - a.updatedAt;
    });

    list.innerHTML = sorted.map(n => `
      <div class="note-page-row">
        <span class="note-page-title" onclick="openNotePage('${n.id}')">
          ${n.pinned ? '📌' : '📄'} ${escapeHtml(n.title || 'Untitled note')}
          ${n.subsystem ? `<span class="subsystem-badge">${escapeHtml(n.subsystem)}</span>` : ''}
        </span>
        <span class="note-page-right">
          <span class="note-page-meta">Edited by ${escapeHtml(n.lastEditedBy || n.author)} · ${new Date(n.updatedAt).toLocaleDateString()}</span>
          <button class="pin-toggle-btn ${n.pinned ? 'pinned' : ''}" onclick="event.stopPropagation(); toggleNotePin('${n.id}')" title="${n.pinned ? 'Unpin' : 'Pin to top'}">★</button>
        </span>
      </div>
    `).join('');
  }

  window.toggleNotePin = async function(id) {
    currentNotes = currentNotes.map(n =>
      n.id === id ? { ...n, pinned: !n.pinned } : n
    );
    await saveTeamField({ notes: currentNotes });
    renderNotes();
  };

  window.createNotePage = async function() {
    const newNote = {
      id: Date.now().toString(),
      title: '',
      body: '',
      subsystem: '',
      author: myName || 'Unknown',
      lastEditedBy: myName || 'Unknown',
      pinned: false,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };

    currentNotes = [...currentNotes, newNote];
    await saveTeamField({ notes: currentNotes });
    renderNotes();
    openNotePage(newNote.id);
  };

  window.openNotePage = function(id) {
    const note = currentNotes.find(n => n.id === id);
    if (!note) return;

    currentNoteId = id;
    document.getElementById('noteTitleInput').value = note.title || '';
    document.getElementById('noteBodyEditor').innerHTML = note.body || '';
    document.getElementById('noteSubsystemSelect').value = note.subsystem || '';
    document.getElementById('noteSaveStatus').textContent = '';

    const pinBtn = document.getElementById('editorPinBtn');
    pinBtn.classList.toggle('pinned', !!note.pinned);
    pinBtn.title = note.pinned ? 'Unpin' : 'Pin to top';

    document.getElementById('noteAiTasksBox').style.display = isCurrentUserLead ? 'block' : 'none';
    document.getElementById('extractedTasksList').innerHTML = '';

    document.getElementById('notesListView').style.display = 'none';
    document.getElementById('notesEditorView').style.display = 'block';
  };

  window.toggleCurrentNotePin = async function() {
    if (!currentNoteId) return;
    await toggleNotePin(currentNoteId);
    const note = currentNotes.find(n => n.id === currentNoteId);
    const pinBtn = document.getElementById('editorPinBtn');
    pinBtn.classList.toggle('pinned', !!note.pinned);
    pinBtn.title = note.pinned ? 'Unpin' : 'Pin to top';
  };

  window.closeNoteEditor = function() {
    currentNoteId = null;
    document.getElementById('notesEditorView').style.display = 'none';
    document.getElementById('notesListView').style.display = 'block';
    renderNotes();
  };

  window.scheduleNoteSave = function() {
    document.getElementById('noteSaveStatus').textContent = 'Saving…';
    clearTimeout(noteSaveTimer);
    noteSaveTimer = setTimeout(saveCurrentNote, 600);
  };

  async function saveCurrentNote() {
    if (!currentNoteId) return;

    const title = document.getElementById('noteTitleInput').value.trim();
    const body = document.getElementById('noteBodyEditor').innerHTML;
    const subsystem = document.getElementById('noteSubsystemSelect').value;

    currentNotes = currentNotes.map(n =>
      n.id === currentNoteId
        ? { ...n, title, body, subsystem, lastEditedBy: myName || 'Unknown', updatedAt: Date.now() }
        : n
    );

    await saveTeamField({ notes: currentNotes });
    document.getElementById('noteSaveStatus').textContent = 'Saved';
  }

  window.deleteCurrentNote = async function() {
    if (!currentNoteId) return;
    if (!confirm('Delete this note? This can\'t be undone.')) return;

    currentNotes = currentNotes.filter(n => n.id !== currentNoteId);
    await saveTeamField({ notes: currentNotes });
    closeNoteEditor();
  };

  // ---------------- AI: EXTRACT TASKS FROM NOTE ----------------

  let lastExtractedTasks = [];

  window.extractTasksFromNote = async function() {
    const noteTitle = document.getElementById('noteTitleInput').value.trim();
    const noteText = document.getElementById('noteBodyEditor').innerText.trim();

    if (!noteText) {
      document.getElementById('error').textContent = 'This note is empty — write something first.';
      return;
    }

    const btn = document.getElementById('extractTasksBtn');
    btn.disabled = true;
    btn.textContent = 'Reading notes…';
    document.getElementById('error').textContent = '';
    document.getElementById('extractedTasksList').innerHTML = '';

    try {
      const parsed = await callAIForTask(buildTaskExtractionPrompt(noteTitle, noteText));
      lastExtractedTasks = Array.isArray(parsed) ? parsed : [];

      if (lastExtractedTasks.length === 0) {
        document.getElementById('extractedTasksList').innerHTML =
          '<div class="empty-state">No actionable tasks found in this note.</div>';
        return;
      }

      renderExtractedTasks();

    } catch (err) {
      console.error(err);
      document.getElementById('error').textContent = 'Could not extract tasks: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ Generate tasks from this note';
    }
  };

  function renderExtractedTasks() {
    const container = document.getElementById('extractedTasksList');

    container.innerHTML = lastExtractedTasks.map((t, i) => `
      <div class="extracted-task-row">
        <input type="checkbox" id="extractedCheck-${i}" checked>
        <div class="extracted-task-info">
          <div class="extracted-task-title">${escapeHtml(t.title || 'Untitled task')}</div>
          <div class="extracted-task-desc">${escapeHtml(t.description || '')}</div>
          <div class="extracted-task-meta">
            <span class="subsystem-badge">${escapeHtml(t.subsystem || 'general')}</span>
            ${t.suggestedAssignee ? `<span class="assignee-tag">→ ${escapeHtml(t.suggestedAssignee)}</span>` : ''}
          </div>
        </div>
      </div>
    `).join('') + `
      <button class="btn btn-primary add-extracted-btn" onclick="addSelectedExtractedTasks()">Add selected to Tasks</button>
    `;
  }

  window.addSelectedExtractedTasks = async function() {
    const selected = lastExtractedTasks.filter((t, i) => {
      const check = document.getElementById(`extractedCheck-${i}`);
      return check && check.checked;
    });

    if (selected.length === 0) {
      document.getElementById('error').textContent = 'Select at least one task to add.';
      return;
    }

    const newTasks = selected.map(t => {
      const validAssignee = currentMembers.some(m => m.name === t.suggestedAssignee) ? t.suggestedAssignee : null;
      return {
        id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
        title: t.title || 'Untitled task',
        description: t.description || '',
        subsystem: t.subsystem || 'general',
        assignedNames: validAssignee ? [validAssignee] : [],
        status: 'todo'
      };
    });

    currentTasks = [...currentTasks, ...newTasks];
    await saveTeamField({ tasks: currentTasks });
    renderTasks();

    lastExtractedTasks = [];
    document.getElementById('extractedTasksList').innerHTML =
      `<div class="empty-state">Added ${newTasks.length} task${newTasks.length > 1 ? 's' : ''} — check the Tasks tab.</div>`;
  };

  window.formatDoc = function(command, value) {
    document.getElementById('noteBodyEditor').focus();
    document.execCommand(command, false, value || null);
    scheduleNoteSave();
  };

  window.insertChecklistItem = function() {
    const editor = document.getElementById('noteBodyEditor');
    editor.focus();

    const li = document.createElement('li');
    li.className = 'checklist-item';
    li.innerHTML = `<input type="checkbox"> <span contenteditable="true">New item</span>`;

    const ul = document.createElement('ul');
    ul.style.listStyle = 'none';
    ul.style.padding = '0';
    ul.appendChild(li);

    document.execCommand('insertHTML', false, ul.outerHTML);
    scheduleNoteSave();
  };

  // ---------------- EVENTS (manual entry + countdown) ----------------

  let countdownTimer = null;

  window.toggleFtcSyncForm = function() {
    document.getElementById('ftcSyncForm').classList.toggle('open');
  };

  window.syncFromFtcApi = async function() {
    const teamNumber = document.getElementById('ftcTeamNumber').value.trim();
    const season = document.getElementById('ftcSeason').value.trim();

    if (!teamNumber || !season) {
      document.getElementById('error').textContent = 'Enter both FTC team number and season.';
      return;
    }

    await saveTeamField({ ftcTeamNumber: teamNumber, ftcSeason: season });

    const btn = document.getElementById('syncFtcBtn');
    btn.disabled = true;
    btn.textContent = 'Syncing…';
    document.getElementById('error').textContent = '';

    try {
      const res = await fetch(`${FTC_PROXY_URL}/?season=${season}&teamNumber=${teamNumber}`);

      if (!res.ok) {
        throw new Error(`Proxy returned ${res.status}`);
      }

      const data = await res.json();

      if (data.error) {
        throw new Error(data.error);
      }

      const ftcEvents = data.events?.events || [];

      if (ftcEvents.length === 0) {
        document.getElementById('error').textContent = 'No events found for that team/season — check the FTC team number and season are correct.';
        return;
      }

      // merge: update any already-synced event with fresh data (patches
      // old records missing newer fields like ftcSeason), and add any
      // genuinely new ones
      const existingByCode = new Map(
        currentEvents.filter(e => e.ftcEventCode).map(e => [e.ftcEventCode, e])
      );

      const freshMapped = ftcEvents
        .map(e => ({
          id: existingByCode.get(e.code)?.id || (Date.now().toString() + Math.random().toString(36).slice(2, 7)),
          name: e.name || 'FTC Event',
          date: e.dateStart ? e.dateStart.split('T')[0] : '',
          dateEnd: e.dateEnd ? e.dateEnd.split('T')[0] : null,
          location: [e.venue, e.city].filter(Boolean).join(', '),
          venue: e.venue || null,
          address: e.address || null,
          city: e.city || null,
          stateProv: e.stateprov || null,
          country: e.country || null,
          liveStreamUrl: e.liveStreamUrl || null,
          timezone: e.timezone || null,
          ftcEventCode: e.code || null,
          ftcSeason: season
        }))
        .filter(e => e.date); // skip anything without a usable date

      const freshCodes = new Set(freshMapped.map(e => e.ftcEventCode));
      const untouchedExisting = currentEvents.filter(e => !e.ftcEventCode || !freshCodes.has(e.ftcEventCode));
      const newOnes = freshMapped.filter(e => !existingByCode.has(e.ftcEventCode));

      currentEvents = [...untouchedExisting, ...freshMapped];
      await saveTeamField({ events: currentEvents });
      renderEvents();

      document.getElementById('ftcSyncForm').classList.remove('open');
      document.getElementById('error').textContent = newOnes.length > 0
        ? ''
        : 'Synced, but all events were already added.';

    } catch (err) {
      console.error(err);
      document.getElementById('error').textContent = 'FTC sync failed: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '🔄 Sync from FTC API';
    }
  };

  window.toggleEventForm = function() {
    document.getElementById('eventForm').classList.toggle('open');
  };

  window.saveEvent = async function() {
    const name = document.getElementById('eventName').value.trim();
    const date = document.getElementById('eventDate').value;
    const location = document.getElementById('eventLocation').value.trim();

    if (!name || !date) {
      document.getElementById('error').textContent = 'Event needs a name and date.';
      return;
    }

    const newEvent = {
      id: Date.now().toString(),
      name,
      date,
      location
    };

    currentEvents = [...currentEvents, newEvent];
    await saveTeamField({ events: currentEvents });
    renderEvents();

    document.getElementById('eventForm').classList.remove('open');
    document.getElementById('eventName').value = '';
    document.getElementById('eventDate').value = '';
    document.getElementById('eventLocation').value = '';
  };

  window.deleteEvent = async function(id) {
    if (!confirm('Delete this event?')) return;
    currentEvents = currentEvents.filter(e => e.id !== id);
    await saveTeamField({ events: currentEvents });
    renderEvents();
  };

  function renderEvents() {
    const now = new Date();
    const upcoming = currentEvents
      .filter(e => new Date(e.date) >= new Date(now.toDateString()))
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    const past = currentEvents
      .filter(e => new Date(e.date) < new Date(now.toDateString()))
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    // countdown to the soonest upcoming event
    if (countdownTimer) clearInterval(countdownTimer);
    if (upcoming.length > 0) {
      startCountdown(upcoming[0]);
    } else {
      document.getElementById('nextEventCountdown').innerHTML = '';
    }

    const list = [...upcoming, ...past];
    const listEl = document.getElementById('eventsListDisplay');

    if (list.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No events added yet.</div>';
      return;
    }

    listEl.innerHTML = list.map(e => {
      const isPast = new Date(e.date) < new Date(now.toDateString());
      return `
        <div class="ftc-event-card ${isPast ? 'event-past' : ''}" onclick="openEventDetail('${e.id}')">
          <div class="ftc-event-name">${escapeHtml(e.name)}</div>
          <div class="ftc-event-meta">
            ${escapeHtml(new Date(e.date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }))}
            ${e.location ? ' · ' + escapeHtml(e.location) : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  window.openEventDetail = function(id) {
    const e = currentEvents.find(ev => ev.id === id);
    if (!e) return;

    const dateLabel = e.dateEnd && e.dateEnd !== e.date
      ? `${formatDate(e.date)} – ${formatDate(e.dateEnd)}`
      : formatDate(e.date);

    const rows = [
      ['Date', dateLabel],
      ['Venue', e.venue],
      ['Address', [e.address, e.city, e.stateProv, e.country].filter(Boolean).join(', ') || e.location],
      ['Timezone', e.timezone],
    ].filter(([, val]) => val);

    const detailHtml = `
      <div class="event-detail-title">${escapeHtml(e.name)}</div>
      ${rows.map(([label, val]) => `
        <div class="event-detail-row">
          <span class="event-detail-label">${escapeHtml(label)}</span>
          <span class="event-detail-value">${escapeHtml(val)}</span>
        </div>
      `).join('')}
      ${e.liveStreamUrl ? `<a class="btn btn-primary event-detail-livestream" href="${escapeHtml(e.liveStreamUrl)}" target="_blank" rel="noopener">▶ Watch livestream</a>` : ''}
      ${e.ftcEventCode ? `
        <button class="btn btn-secondary" id="loadMatchesBtn" style="margin-top:14px; width:100%;" onclick="loadEventMatches('${escapeHtml(e.ftcEventCode)}', '${escapeHtml(e.ftcSeason || '')}')">📋 Load match results</button>
        <div id="matchesContainer"></div>
      ` : ''}
      ${isCurrentUserLead ? `<button class="btn btn-danger" style="margin-top:14px;" onclick="deleteEvent('${e.id}'); closeEventDetail();">Delete event</button>` : ''}
    `;

    document.getElementById('eventDetailBody').innerHTML = detailHtml;
    document.getElementById('eventDetailOverlay').classList.add('open');
  };

  window.loadEventMatches = async function(eventCode, season) {
    if (!season) {
      document.getElementById('matchesContainer').innerHTML = '<div class="empty-state">No season on record for this event — try re-syncing it.</div>';
      return;
    }

    const btn = document.getElementById('loadMatchesBtn');
    btn.disabled = true;
    btn.textContent = 'Loading matches…';

    try {
      const res = await fetch(`${FTC_PROXY_URL}/?season=${season}&eventCode=${eventCode}`);
      if (!res.ok) throw new Error(`Proxy returned ${res.status}`);

      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const allMatches = [
        ...(data.qual || []).map(m => ({ ...m, roundLabel: 'Qual' })),
        ...(data.playoff || []).map(m => ({ ...m, roundLabel: 'Playoff' }))
      ];

      if (allMatches.length === 0) {
        document.getElementById('matchesContainer').innerHTML = '<div class="empty-state">No match data yet — this event may not have started.</div>';
        return;
      }

      document.getElementById('matchesContainer').innerHTML = allMatches.map(renderMatchCard).join('');

    } catch (err) {
      console.error(err);
      document.getElementById('matchesContainer').innerHTML = `<div class="empty-state">Could not load matches: ${escapeHtml(err.message)}</div>`;
    } finally {
      btn.style.display = 'none';
    }
  };

  function renderMatchCard(m) {
    const redTeams = (m.teams || []).filter(t => t.station && t.station.startsWith('Red')).map(t => t.teamNumber);
    const blueTeams = (m.teams || []).filter(t => t.station && t.station.startsWith('Blue')).map(t => t.teamNumber);

    const played = m.scoreRedFinal !== null && m.scoreRedFinal !== undefined;
    const redWon = played && m.scoreRedFinal > m.scoreBlueFinal;
    const blueWon = played && m.scoreBlueFinal > m.scoreRedFinal;

    return `
      <div class="match-card">
        <div class="match-header">${escapeHtml(m.roundLabel)} ${m.matchNumber != null ? '#' + m.matchNumber : ''}</div>
        <div class="match-alliance ${redWon ? 'match-winner' : ''}">
          <span class="match-alliance-label alliance-red">Red</span>
          <span class="match-teams">${redTeams.join(', ') || '—'}</span>
          <span class="match-score">${played ? m.scoreRedFinal : ''}</span>
        </div>
        <div class="match-alliance ${blueWon ? 'match-winner' : ''}">
          <span class="match-alliance-label alliance-blue">Blue</span>
          <span class="match-teams">${blueTeams.join(', ') || '—'}</span>
          <span class="match-score">${played ? m.scoreBlueFinal : ''}</span>
        </div>
        ${!played ? '<div class="match-not-played">Not yet played</div>' : ''}
      </div>
    `;
  }

  window.closeEventDetail = function() {
    document.getElementById('eventDetailOverlay').classList.remove('open');
  };

  function formatDate(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  }

  function startCountdown(event) {
    const target = new Date(event.date + 'T00:00:00').getTime();

    function tick() {
      const now = Date.now();
      const diff = target - now;

      const el = document.getElementById('nextEventCountdown');

      if (diff <= 0) {
        el.innerHTML = `
          <div class="countdown-card">
            <div class="countdown-label">Happening now / today</div>
            <div class="countdown-event-name">${escapeHtml(event.name)}</div>
          </div>
        `;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      el.innerHTML = `
        <div class="countdown-card">
          <div class="countdown-label">Next event: ${escapeHtml(event.name)}</div>
          <div class="countdown-timer">
            <span>${days}<small>d</small></span>
            <span>${String(hours).padStart(2, '0')}<small>h</small></span>
            <span>${String(minutes).padStart(2, '0')}<small>m</small></span>
            <span>${String(seconds).padStart(2, '0')}<small>s</small></span>
          </div>
        </div>
      `;
    }

    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
</script>

</body>
</html>
